[project]
name = "invoicer"
version = "0.2.0"
description = "Invoice totals with tax: the sample project for Chapters 5 and 6"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.5"]

[project.scripts]
invoicer-billing = "invoicer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "pytest-mock>=3",
    "pytest-asyncio>=1.4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyright>=1.1.400",
]
notebooks = ["jupyterlab>=4", "pandas>=2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",  # the Chapter 5 baseline
    "S",       # flake8-bandit: security
    "ASYNC",   # blocking calls in async code
    "BLE",     # blind `except Exception`
    "PGH",     # blanket `# type: ignore` and `# noqa`
    "C90",     # McCabe complexity
    "ANN401",  # `Any` in annotations
    "RUF100",  # `# noqa` comments that no longer suppress anything
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "ANN401"]
".claude/hooks/*" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["invoicer"]

[tool.mypy]
strict = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = ["src/invoicer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: needs INVOICER_DB_URL; skipped when it is not set",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == .__main__.:']
fail_under = 90
