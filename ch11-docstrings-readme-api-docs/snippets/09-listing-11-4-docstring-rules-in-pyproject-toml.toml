[tool.ruff.lint]
select = [
    # ... the rules from Chapters 5 and 10 ...
    "D",       # pydocstyle: docstrings on the public API
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "ANN401", "D"]
".claude/hooks/*" = ["S603", "S607", "D"]
"scripts/*" = ["D"]
