[project]
name = "invoicer"
version = "0.2.0"
description = "Invoice totals with tax: the sample project for Chapters 5 and 6"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
notebooks = ["jupyterlab>=4", "pandas>=2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["invoicer"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: needs INVOICER_DB_URL; skipped when it is not set",
]
