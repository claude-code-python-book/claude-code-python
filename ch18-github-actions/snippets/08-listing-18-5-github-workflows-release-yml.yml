name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Check that the tag matches the version
        run: uv run --no-project scripts/check_version.py "$GITHUB_REF_NAME"
      - run: uv build
      - name: Smoke-test the wheel and the sdist
        run: |
          uv run --isolated --no-project --with dist/*.whl scripts/smoke_test.py
          uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_test.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowbatch
    permissions:
      id-token: write  # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
