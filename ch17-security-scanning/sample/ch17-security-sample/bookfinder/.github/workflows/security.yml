name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"  # Mondays: catch advisories published since the last change

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the history
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --all-groups
      - name: Lint, including Ruff's S (flake8-bandit) rules
        run: uv run ruff check .
      - name: Bandit
        run: uv run --group security bandit -c pyproject.toml -r src
      - name: Known vulnerabilities in locked dependencies
        run: uv export --locked --no-emit-project --format requirements.txt -o req.txt && uv run --group security pip-audit -r req.txt --require-hashes --disable-pip
      - name: Secrets in the repository history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo
      - name: Tests
        run: uv run pytest -q
