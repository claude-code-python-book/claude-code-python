[project]
name = "bookfinder"
version = "0.1.0"
description = "A small book catalogue with a search endpoint"
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "requests>=2.32.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.16", "mypy>=1.18",
       "types-pyyaml", "types-requests"]
security = ["bandit[toml]>=1.9", "pip-audit>=2.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.mypy]
strict = true
files = ["src"]
