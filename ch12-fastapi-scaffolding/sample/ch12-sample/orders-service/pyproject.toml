[project]
name = "orders-service"
version = "1.0.0"
description = "Orders API for the shop: the sample project for Chapter 12"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163",
    "pydantic-settings>=2.14",
    "pyjwt>=2.10",
    "pwdlib[argon2]",
]

[dependency-groups]
dev = ["pytest>=9", "httpx", "ruff>=0.16", "mypy>=2.3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "orders.main:app"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "S", "ASYNC", "BLE", "PGH", "RUF100",
    "D",       # docstrings on the public API (Chapter 11)
    "FAST",    # FastAPI: Annotated dependencies, path parameters
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]
"scripts/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["orders"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
