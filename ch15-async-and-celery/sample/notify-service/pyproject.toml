[project]
name = "notify-service"
version = "1.0.0"
description = "Order confirmation emails with asyncio and Celery: the sample project for Chapter 15"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7,<5.8",
    "redis>=6",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=9", "anyio>=4.11", "ruff>=0.16", "mypy>=1.19"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "D", "BLE", "ASYNC", "RUF"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["notify", "tests"]
