[project]
name = "billing-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2", "invoicer"]

[dependency-groups]
dev = ["pytest>=9", "pytest-django>=4.14"]

[tool.uv.sources]
invoicer = { path = "../../invoicer", editable = true }

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["portal/migrations"]
