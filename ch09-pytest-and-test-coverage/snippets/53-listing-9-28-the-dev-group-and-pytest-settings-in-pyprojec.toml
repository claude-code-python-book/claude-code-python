[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "pytest-mock>=3",
    "pytest-asyncio>=1.4",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"
