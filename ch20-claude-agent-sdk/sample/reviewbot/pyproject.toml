[project]
name = "reviewbot"
version = "0.1.0"
description = "A pull-request review agent built on the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2.172"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::claude_agent_sdk.CanUseToolShadowedWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S108", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["reviewbot"]
known-local-folder = ["fakecli", "script"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reviewbot.api"]
disallow_untyped_decorators = false
