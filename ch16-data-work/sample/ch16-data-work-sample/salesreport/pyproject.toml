[project]
name = "salesreport"
version = "0.1.0"
description = "Monthly sales report from the shop's order export"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0,<4",
    "matplotlib>=3.10",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "mypy>=1.18", "pandas-stubs>=3.0"]
notebooks = ["jupyterlab>=4", "nbstripout>=0.8"]
extras = ["polars>=2.0", "pandera[pandas]>=0.30", "plotly>=7", "pyarrow>=21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "PD", "NPY", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"notebooks/**" = ["D", "E402"]

[tool.mypy]
strict = true
files = ["src"]
