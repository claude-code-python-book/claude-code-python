apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-worker
  labels:
    app.kubernetes.io/name: catalog-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: worker
          image: catalog:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "catalog.tasks", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: catalog
            - secretRef:
                name: catalog
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
