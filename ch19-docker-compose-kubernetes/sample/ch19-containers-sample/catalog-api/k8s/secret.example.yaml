# Example only. Create the real Secret from the command line instead:
#   kubectl create secret generic catalog \
#     --from-literal=DATABASE_URL='postgresql+psycopg://catalog:...@db:5432/catalog'
apiVersion: v1
kind: Secret
metadata:
  name: catalog
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://catalog:change-me@db:5432/catalog
