[project]
name = "catalog"
version = "1.0.0"
description = "Catalog service used to show containers, Compose, Kubernetes and Helm"
requires-python = ">=3.13"
dependencies = [
    "starlette>=1.7",
    "uvicorn>=0.54",
    "celery[redis]>=5.6",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.16", "mypy>=1.18"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ASYNC"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["catalog.tasks"]
disallow_untyped_decorators = false
