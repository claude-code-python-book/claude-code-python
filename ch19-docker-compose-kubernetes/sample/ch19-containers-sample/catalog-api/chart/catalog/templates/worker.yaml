apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-worker
        {{- include "catalog.labels" . | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: worker
          image: {{ include "catalog.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "catalog.tasks", "worker", "--loglevel=INFO"]
          {{- include "catalog.env" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
