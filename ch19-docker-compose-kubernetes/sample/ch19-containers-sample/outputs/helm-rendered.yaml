---
# Source: catalog/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog
  labels:
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: catalog-0.1.0
data:
  REDIS_URL: "redis://redis:6379/0"
---
# Source: catalog/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-web
  labels:
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: catalog-0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-web
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/version: "1.0.0"
        helm.sh/chart: catalog-0.1.0
      annotations:
        checksum/config: d8025a1b5aa4dd79f4e632858c14d43fbc74384d8ffb8fabf8b84f4ab306be41
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: web
          image: catalog:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef:
                name: catalog
            - secretRef:
                name: catalog
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Source: catalog/templates/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
  labels:
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: catalog-0.1.0
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: migrate
          image: catalog:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: catalog
---
# Source: catalog/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: catalog-0.1.0
spec:
  selector:
    app.kubernetes.io/name: catalog-web
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Source: catalog/templates/worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-worker
  labels:
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/version: "1.0.0"
    helm.sh/chart: catalog-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-worker
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/version: "1.0.0"
        helm.sh/chart: catalog-0.1.0
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: worker
          image: catalog:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "catalog.tasks", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: catalog
            - secretRef:
                name: catalog
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
