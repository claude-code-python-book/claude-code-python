name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run --group security bandit -c pyproject.toml -r src

  test:
    name: Tests with PostgreSQL
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookshop
          POSTGRES_PASSWORD: bookshop
          POSTGRES_DB: bookshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bookshop:bookshop@localhost:5432/bookshop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
      - run: uv sync --locked
      - run: uv run alembic upgrade head && uv run alembic downgrade base
      - run: uv run pytest --cov --cov-report=term-missing

  image:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging        # required reviewers approve the deploy here
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.2
      - name: helm upgrade
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}
          REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          umask 077 && printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          helm upgrade --install bookshop chart/bookshop \
            --set image.repository="$REPO" --set image.tag="$TAG" \
            --wait --rollback-on-failure --timeout 5m
